<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Roy Zhao | 甘南</title><meta name="description" content="甘南 · 2022.08.03 - 08.07"><link rel="icon" href="/zz/images/favicon.webp"><script>(()=>{const media=matchMedia('(prefers-color-scheme: dark)');const set=()=>document.documentElement.dataset.theme=media.matches?'dark':'light';set();media.addEventListener('change',set)})()</script><link rel="stylesheet" href="/shared/account-auth.css"><link rel="stylesheet" href="/shared/photo-typography.css?v=20261115-header"><link rel="stylesheet" href="/shared/destination-typography.css"><style>
:root{color-scheme:light;--paper:#fff;--ink:#2c2a27;--muted:#8c8273;--line:#e2dcd0;--footer:#5e6063}[data-theme=dark]{color-scheme:dark;--paper:#121110;--ink:#e9e5dd;--muted:#b3aca1;--line:#302d28;--footer:#171614}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:'Times New Roman','Noto Serif SC','Songti SC',serif;line-height:1.9}a{color:inherit}header{background:#080808;color:#fff;position:sticky;top:0;z-index:5;border-bottom:1px solid #ffffff1a}header>div{max-width:1240px;margin:auto;padding:18px 40px;display:flex;justify-content:space-between;align-items:center;gap:20px}.identity{display:flex;gap:14px;align-items:center}.logo{text-decoration:none;font-size:34px;line-height:1}.identity img{width:32px;height:32px;border-radius:50%;object-fit:cover}.identity span{font-size:13px}header strong{font-size:16px;letter-spacing:.15em;font-weight:400}main{max-width:860px;margin:auto;padding:66px 32px 80px}h1{font-size:40px;font-weight:400;letter-spacing:.12em;margin:0}.trip-date{color:var(--muted);font-size:13px;letter-spacing:.15em;border-bottom:1px solid var(--line);padding-bottom:30px;margin-bottom:36px}.prose{overflow-wrap:anywhere}.prose h2,.prose h3{font-weight:400;margin-top:2em;scroll-margin-top:100px}.prose img{display:block;max-width:80%;height:auto;margin:32px auto}.prose blockquote{border-left:2px solid var(--line);padding-left:24px;color:var(--muted);margin-inline:0}.prose pre{background:color-mix(in srgb,var(--ink) 6%,var(--paper));overflow:auto;padding:20px}.prose table{border-collapse:collapse;width:100%;display:block;overflow:auto}.prose td,.prose th{border:1px solid var(--line);padding:8px 14px}.prose a{text-underline-offset:4px}footer{background:var(--footer);color:#fffC;text-align:center;padding:36px 20px;font-size:12px;letter-spacing:.12em}footer a{display:inline-block;margin-top:14px;text-decoration:none;border-bottom:1px solid #fff7}.notes{border-top:1px solid var(--line);margin-top:64px;padding-top:28px}.notes h2{font-size:20px;font-weight:400}.notes input,.notes textarea{display:block;width:100%;font:inherit;font-size:14px;color:var(--ink);background:var(--paper);border:1px solid var(--line);padding:10px;margin:10px 0}.notes button{font:inherit;font-size:12px;background:transparent;border:1px solid var(--line);color:inherit;padding:8px 16px;cursor:pointer}.notes li{list-style:none;border-bottom:1px solid var(--line);padding:18px 0}.notes ul{padding:0}.notes small{color:var(--muted)}[hidden]{display:none!important}.preview-note{background:#eee6d4;color:#514c42;padding:10px;text-align:center;font-size:12px}@media(max-width:600px){header>div{padding:14px 20px}main{padding:40px 22px}h1{font-size:30px}.identity span{display:none}.prose img{max-width:100%}}
</style></head><body><header><div><div class="identity"><a class="logo" href="/zz/">zᶻ</a><img src="/zz/images/ROY_8128_01.webp" alt="头像"><span>Roy Zhao / 赵润涵</span></div><strong>甘南</strong></div></header><main><h1>甘南</h1><p class="trip-date">2022.08.03 - 08.07</p><article class="prose"><p>即将更新～</p></article><section class="notes" id="destination-notes" data-page="/zz/destinations/gannan"><h2>旅途留言</h2><p data-status role="status">正在读取留言…</p><roy-account-auth></roy-account-auth><form data-comment-form hidden><textarea name="body" rows="3" maxlength="2000" placeholder="留下一点旅途的回声…" required></textarea><button type="submit">留下留言</button></form><ul data-comments></ul><button data-more hidden>更多留言</button></section></main><footer><div>© 2026 Roy Zhao / 赵润涵. 保留所有权利。</div><a href="/zz/">返回相册 →</a></footer><script type="module">import '/shared/photo-client.js';
// Keep the album's original form and list; both sites address the same comment rows.
const section=document.getElementById('destination-notes');
const statusNode=section.querySelector('[data-status]'),list=section.querySelector('[data-comments]'),form=section.querySelector('[data-comment-form]'),more=section.querySelector('[data-more]'),auth=section.querySelector('roy-account-auth');
const page=section.dataset.page||location.pathname.replace(/\/+$/,'');
const input=form.elements.body,submit=form.querySelector('[type=submit]');
let api,user=null,nickname='',rows=[],offset=0,loading=false,posting=false,started=false,request=0,authRequest=0,profileNote='',retry=false;
function message(text){statusNode.textContent=text+(profileNote?' '+profileNote:'')}
function failure(){return '暂时无法连接留言服务，请点击重试。'}
function identity(){form.hidden=!user?.email_confirmed_at||!nickname;submit.disabled=posting||!input.value.trim();input.disabled=posting}
function text(tag,value){const node=document.createElement(tag);node.textContent=value;return node}
async function syncSession(){
 const version=++authRequest;
 try{
  const {data,error}=await api.auth.getSession();if(error)throw error;
  const next=data.session?.user||null;let name='';
  if(next?.email_confirmed_at){const result=await api.from('roy_top_profiles').select('nickname').eq('user_id',next.id).abortSignal(AbortSignal.timeout(12000)).maybeSingle();if(result.error)throw result.error;name=result.data?.nickname||''}
  if(version!==authRequest)return;
  if(user?.id!==next?.id){input.value='';++request}
  user=next;nickname=name;profileNote=user&&!nickname?'请先在主站留言区设置固定昵称，再返回这里留言。':'';identity();await load(true)
 }catch{if(version===authRequest){user=null;nickname='';identity();retry=true;more.hidden=false;more.textContent='重试';message(failure())}}
}
function render(){
 list.replaceChildren();
 for(const row of rows){
  const item=document.createElement('li'),header=document.createElement('div');header.append(text('strong',row.author_name+(row.parent_id?' · 回复':'')));
  const date=text('time',' '+new Date(row.created_at).toLocaleString('zh-CN',{timeZone:'Asia/Shanghai'}));date.dateTime=row.created_at;header.append(date);
  const body=document.createElement('div');if(window.RoyRichComments)window.RoyRichComments.renderBody(body,row.body);else body.textContent=row.body;
  item.append(header,body);
  if(row.status==='pending'&&row.user_id===user?.id)item.append(text('small','待审核，仅自己可见'));
  if(row.user_id===user?.id){const remove=text('button','删除');remove.type='button';remove.onclick=async()=>{if(!confirm('删除这条留言？'))return;remove.disabled=true;try{const {error}=await api.from('roy_top_comments').delete().eq('id',row.id).eq('user_id',user.id).abortSignal(AbortSignal.timeout(12000));if(error)throw error;await load(true)}catch{remove.disabled=false;message(failure())}};item.append(remove)}
  list.append(item);
 }
}
async function load(reset=false){
 if(!api||loading&&!reset)return;
 const version=++request,start=reset?0:offset;loading=true;more.disabled=true;message('正在读取留言…');
 try{
  const {data,error}=await api.from('roy_top_comments').select('id,user_id,author_name,body,created_at,status,parent_id').eq('page_path',page).order('created_at',{ascending:false}).order('id',{ascending:false}).range(start,start+19).abortSignal(AbortSignal.timeout(12000));
  if(version!==request)return;if(error)throw error;
  const incoming=data||[];rows=reset?incoming:[...rows,...incoming.filter(row=>!rows.some(existing=>existing.id===row.id))];offset=start+incoming.length;more.hidden=incoming.length<20;more.textContent='更多留言';retry=false;render();message(rows.length?rows.length+' 条留言与回复':'还没有留言，欢迎写下第一句。');
 }catch{if(version===request){retry=true;more.hidden=false;more.textContent='重试';message(failure())}}finally{if(version===request){loading=false;more.disabled=false}}
}
async function ready(){
 if(started||!window.RoyPhotoClient)return;started=true;clearTimeout(startupTimer);api=window.RoyPhotoClient;
 api.auth.onAuthStateChange(()=>{setTimeout(()=>void syncSession(),0)});await syncSession();
}
input.addEventListener('input',identity);
auth.addEventListener('roy-auth-complete',()=>void syncSession());
form.onsubmit=async event=>{
 event.preventDefault();const body=input.value.trim();if(posting||!user?.email_confirmed_at||!nickname||!body||body.length>2000)return;
 posting=true;identity();message('正在发送…');
 try{const {error}=await api.from('roy_top_comments').insert({page_path:page,user_id:user.id,author_name:nickname,body,parent_id:null}).abortSignal(AbortSignal.timeout(12000));if(error)throw error;input.value='';await load(true)}catch{message(failure())}finally{posting=false;identity()}
};
more.onclick=()=>{if(!api){void ready();return}if(retry)void syncSession();else void load()};
identity();
const startupTimer=setTimeout(()=>{if(!started){retry=true;more.hidden=false;more.textContent='重试';message(failure())}},12000);
window.addEventListener('roy-photo-ready',()=>void ready(),{once:true});
if(window.RoyPhotoClient)void ready();else import('/shared/photo-client.js').then(()=>void ready()).catch(()=>{clearTimeout(startupTimer);more.hidden=false;more.textContent='重试';retry=true;message(failure())});

</script></body></html>
