<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>甘孜 · Roy Zhao</title><meta name="description" content="甘孜 · 2025.08.03"><link rel="icon" href="/zz/images/favicon.png"><script>(()=>{const media=matchMedia('(prefers-color-scheme: dark)');const set=()=>document.documentElement.dataset.theme=media.matches?'dark':'light';set();media.addEventListener('change',set)})()</script><link rel="stylesheet" href="/shared/account-auth.css"><style>
:root{color-scheme:light;--paper:#fff;--ink:#2c2a27;--muted:#8c8273;--line:#e2dcd0;--footer:#5e6063}[data-theme=dark]{color-scheme:dark;--paper:#121110;--ink:#e9e5dd;--muted:#b3aca1;--line:#302d28;--footer:#171614}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:'Times New Roman','Noto Serif SC','Songti SC',serif;line-height:1.9}a{color:inherit}header{background:#080808;color:#fff;position:sticky;top:0;z-index:5;border-bottom:1px solid #ffffff1a}header>div{max-width:1240px;margin:auto;padding:18px 40px;display:flex;justify-content:space-between;align-items:center;gap:20px}.identity{display:flex;gap:14px;align-items:center}.logo{text-decoration:none;font-size:34px;line-height:1}.identity img{width:32px;height:32px;border-radius:50%;object-fit:cover}.identity span{font-size:13px}header strong{font-size:16px;letter-spacing:.15em;font-weight:400}main{max-width:860px;margin:auto;padding:66px 32px 80px}h1{font-size:40px;font-weight:400;letter-spacing:.12em;margin:0}.trip-date{color:var(--muted);font-size:13px;letter-spacing:.15em;border-bottom:1px solid var(--line);padding-bottom:30px;margin-bottom:36px}.prose{overflow-wrap:anywhere}.prose h2,.prose h3{font-weight:400;margin-top:2em;scroll-margin-top:100px}.prose img{display:block;max-width:100%;height:auto;margin:32px auto}.prose blockquote{border-left:2px solid var(--line);padding-left:24px;color:var(--muted);margin-inline:0}.prose pre{background:color-mix(in srgb,var(--ink) 6%,var(--paper));overflow:auto;padding:20px}.prose table{border-collapse:collapse;width:100%;display:block;overflow:auto}.prose td,.prose th{border:1px solid var(--line);padding:8px 14px}.prose a{text-underline-offset:4px}footer{background:var(--footer);color:#fffC;text-align:center;padding:36px 20px;font-size:12px;letter-spacing:.12em}footer a{display:inline-block;margin-top:14px;text-decoration:none;border-bottom:1px solid #fff7}.notes{border-top:1px solid var(--line);margin-top:64px;padding-top:28px}.notes h2{font-size:20px;font-weight:400}.notes input,.notes textarea{display:block;width:100%;font:inherit;font-size:14px;color:var(--ink);background:var(--paper);border:1px solid var(--line);padding:10px;margin:10px 0}.notes button{font:inherit;font-size:12px;background:transparent;border:1px solid var(--line);color:inherit;padding:8px 16px;cursor:pointer}.notes li{list-style:none;border-bottom:1px solid var(--line);padding:18px 0}.notes ul{padding:0}.notes small{color:var(--muted)}[hidden]{display:none!important}.preview-note{background:#eee6d4;color:#514c42;padding:10px;text-align:center;font-size:12px}@media(max-width:600px){header>div{padding:14px 20px}main{padding:40px 22px}h1{font-size:30px}.identity span{display:none}}
</style></head><body><header><div><div class="identity"><a class="logo" href="/zz/">zᶻ</a><img src="/zz/images/ROY_8128_01.jpg" alt="头像"><span>Roy Zhao / 赵润涵</span></div><strong>甘孜</strong></div></header><main><h1>甘孜</h1><p class="trip-date">2025.08.03</p><article class="prose"><p>即将更新～</p></article><section class="notes" id="destination-notes"><h2>旅途留言</h2><p data-status role="status">正在读取留言…</p><roy-account-auth></roy-account-auth><form data-comment-form hidden><textarea aria-label="目的地留言内容" name="body" rows="3" maxlength="2000" placeholder="留下一点旅途的回声…" required></textarea><button type="submit">留下留言</button></form><ul data-comments></ul><button data-more hidden>更多留言</button></section></main><footer><div>© 2026 Roy Zhao / 赵润涵. 保留所有权利。</div><a href="/zz/">返回相册 →</a></footer><script type="module">import '/shared/photo-client.js';
// Compact destination guestbook; uses existing verified accounts and comment RLS.
const section=document.getElementById('destination-notes');
let api,user=null,nickname='',offset=0,busy=false;
const status=section.querySelector('[data-status]'),list=section.querySelector('[data-comments]'),form=section.querySelector('form'),more=section.querySelector('[data-more]');
const page=location.pathname.replace(/\/+$/,'');
function message(text){status.textContent=text}
function text(tag,value){const node=document.createElement(tag);node.textContent=value;return node}
async function load(reset=false){
 if(busy)return;busy=true;more.disabled=true;
 try{if(reset){offset=0;list.replaceChildren()}
 const {data,error}=await api.from('roy_top_comments').select('id,user_id,author_name,body,created_at').eq('page_path',page).is('parent_id',null).order('created_at',{ascending:false}).order('id',{ascending:false}).range(offset,offset+19).abortSignal(AbortSignal.timeout(12000));if(error)throw error;
 for(const row of data){const li=document.createElement('li'),head=text('strong',row.author_name),body=text('p',row.body),date=text('small',new Date(row.created_at).toLocaleString('zh-CN',{timeZone:'Asia/Shanghai',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false}));li.append(head,body,date);if(row.user_id===user?.id){const remove=text('button','删除');remove.style.marginLeft='12px';remove.onclick=async()=>{if(!confirm('删除这条留言？'))return;const {error}=await api.from('roy_top_comments').delete().eq('id',row.id).eq('user_id',user.id);if(error){message('删除失败，请稍后重试。');return}await load(true)};li.append(remove)}list.append(li)}
 offset+=data.length;more.hidden=data.length<20;message(offset?`${offset} 条留言`:'还没有留言，欢迎写下第一句。');
 }catch{message('留言暂时无法读取，请稍后重试。')}finally{busy=false;more.disabled=false}
}
async function session(){const {data:{user:current}}=await api.auth.getUser();user=current;nickname='';if(user){const {data}=await api.from('roy_top_profiles').select('nickname').eq('user_id',user.id).maybeSingle();nickname=data?.nickname||''}form.hidden=!user||!nickname;await load(true);if(user&&!nickname)message('请先在相册主站设置账号昵称，再回来留言。')}
async function ready(){api=window.RoyPhotoClient;if(!api){message('请通过网站地址打开留言功能。');return}api.auth.onAuthStateChange(()=>setTimeout(()=>void session(),0));await session()}
if(window.RoyPhotoClient)void ready();else window.addEventListener('roy-photo-ready',()=>void ready(),{once:true});
more.onclick=()=>load();
form.onsubmit=async event=>{event.preventDefault();const body=form.elements.body.value.trim();if(!body||!user||!nickname)return;const button=form.querySelector('button');button.disabled=true;try{const {error}=await api.from('roy_top_comments').insert({page_path:page,user_id:user.id,author_name:nickname,body});if(error)throw error;form.reset();await load(true)}catch{message('留言未发送，请检查登录状态，或稍后重试。')}finally{button.disabled=false}};

</script></body></html>
