<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Roy Zhao | 甘孜</title><meta name="description" content="甘孜 · 2025.08.03"><link rel="icon" href="/zz/images/favicon.png"><script>(()=>{const media=matchMedia('(prefers-color-scheme: dark)');const set=()=>document.documentElement.dataset.theme=media.matches?'dark':'light';set();media.addEventListener('change',set)})()</script><link rel="stylesheet" href="/shared/account-auth.css"><style>
:root{color-scheme:light;--paper:#fff;--ink:#2c2a27;--muted:#8c8273;--line:#e2dcd0;--footer:#5e6063}[data-theme=dark]{color-scheme:dark;--paper:#121110;--ink:#e9e5dd;--muted:#b3aca1;--line:#302d28;--footer:#171614}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:'Times New Roman','Noto Serif SC','Songti SC',serif;line-height:1.9}a{color:inherit}header{background:#080808;color:#fff;position:sticky;top:0;z-index:5;border-bottom:1px solid #ffffff1a}header>div{max-width:1240px;margin:auto;padding:18px 40px;display:flex;justify-content:space-between;align-items:center;gap:20px}.identity{display:flex;gap:14px;align-items:center}.logo{text-decoration:none;font-size:34px;line-height:1}.identity img{width:32px;height:32px;border-radius:50%;object-fit:cover}.identity span{font-size:13px}header strong{font-size:16px;letter-spacing:.15em;font-weight:400}main{max-width:860px;margin:auto;padding:66px 32px 80px}h1{font-size:40px;font-weight:400;letter-spacing:.12em;margin:0}.trip-date{color:var(--muted);font-size:13px;letter-spacing:.15em;border-bottom:1px solid var(--line);padding-bottom:30px;margin-bottom:36px}.prose{overflow-wrap:anywhere}.prose h2,.prose h3{font-weight:400;margin-top:2em;scroll-margin-top:100px}.prose img{display:block;max-width:100%;height:auto;margin:32px auto}.prose blockquote{border-left:2px solid var(--line);padding-left:24px;color:var(--muted);margin-inline:0}.prose pre{background:color-mix(in srgb,var(--ink) 6%,var(--paper));overflow:auto;padding:20px}.prose table{border-collapse:collapse;width:100%;display:block;overflow:auto}.prose td,.prose th{border:1px solid var(--line);padding:8px 14px}.prose a{text-underline-offset:4px}footer{background:var(--footer);color:#fffC;text-align:center;padding:36px 20px;font-size:12px;letter-spacing:.12em}footer a{display:inline-block;margin-top:14px;text-decoration:none;border-bottom:1px solid #fff7}.notes{border-top:1px solid var(--line);margin-top:64px;padding-top:28px}.notes h2{font-size:20px;font-weight:400}.notes input,.notes textarea{display:block;width:100%;font:inherit;font-size:14px;color:var(--ink);background:var(--paper);border:1px solid var(--line);padding:10px;margin:10px 0}.notes button{font:inherit;font-size:12px;background:transparent;border:1px solid var(--line);color:inherit;padding:8px 16px;cursor:pointer}.notes li{list-style:none;border-bottom:1px solid var(--line);padding:18px 0}.notes ul{padding:0}.notes small{color:var(--muted)}[hidden]{display:none!important}.notes fieldset{min-width:0;border:0;padding:0;margin:0}.notes label{font-size:13px}.notes textarea{resize:vertical;min-height:112px}.notes-heading,.note-compose-actions,.notes [data-current-user],.note-meta{display:flex;align-items:center;justify-content:space-between;gap:12px}.notes-heading h2{margin:0}.note-compose-actions{margin-top:10px}.note-account{margin:20px 0}.note-account p{font-size:12px;color:var(--muted)}.notes [data-auth-panel],.notes [data-profile-form]{padding:16px;border:1px solid var(--line);margin:14px 0}.notes [data-profile-form] button{margin-top:10px}.notes button:disabled{opacity:.5;cursor:default}.notes [data-post-status]:empty{display:none}.notes [data-status],.notes [data-post-status]{font-size:13px}.notes li p{white-space:pre-wrap;overflow-wrap:anywhere;font-size:14px;line-height:1.8}.note-meta{flex-wrap:wrap;font-size:12px}.note-meta time{color:var(--muted);font-size:11px}.notes .note-delete{padding:0;border:0;font-size:11px;text-decoration:underline;text-underline-offset:3px}.preview-note{background:#eee6d4;color:#514c42;padding:10px;text-align:center;font-size:12px}@media(max-width:600px){header>div{padding:14px 20px}main{padding:40px 22px}h1{font-size:30px}.identity span{display:none}}
</style></head><body><header><div><div class="identity"><a class="logo" href="/zz/">zᶻ</a><img src="/zz/images/ROY_8128_01.jpg" alt="头像"><span>Roy Zhao / 赵润涵</span></div><strong>甘孜</strong></div></header><main><h1>甘孜</h1><p class="trip-date">2025.08.03</p><article class="prose"><p>即将更新～</p></article><section class="notes" id="destination-notes" data-page="/zz/destinations/garze"><div class="notes-heading"><h2>旅途留言</h2><button type="button" data-reload >刷新</button></div><p data-status role="status">正在读取留言…</p><div class="note-account"><button type="button" data-auth-toggle aria-expanded="false" >登录后留言</button><div data-current-user hidden><span data-identity></span><button type="button" data-logout>退出登录</button></div><p data-account-note>账号与相册主站通用。</p><div data-auth-panel hidden><roy-account-auth></roy-account-auth></div><form data-profile-form hidden><label for="destination-nickname">账号昵称</label><input id="destination-nickname" name="nickname" maxlength="40" required placeholder="设置 1～40 字的固定昵称"><small>设置后固定使用，与主站账号共用。</small><button type="submit">保存昵称</button></form></div><form data-comment-form><fieldset disabled><label for="destination-body">留言内容</label><textarea id="destination-body" aria-label="目的地留言内容" name="body" rows="4" maxlength="2000" placeholder="留下一点旅途的回声…" required></textarea><div class="note-compose-actions"><small data-count>0 / 2000</small><button type="submit" disabled>留下留言</button></div></fieldset></form><p data-post-status role="status" aria-live="polite"></p><ul data-comments aria-label="此目的地的留言"></ul><button type="button" data-more hidden>更多留言</button></section></main><footer><div>© 2026 Roy Zhao / 赵润涵. 保留所有权利。</div><a href="/zz/">返回相册 →</a></footer><script type="module">// Destination comments share the site's verified accounts, nicknames and RLS.
const section=document.getElementById('destination-notes');
const find=selector=>section.querySelector(selector);
const list=find('[data-comments]'),form=find('[data-comment-form]'),profileForm=find('[data-profile-form]'),more=find('[data-more]'),reload=find('[data-reload]'),authPanel=find('[data-auth-panel]'),authWidget=find('roy-account-auth'),authToggle=find('[data-auth-toggle]'),accountNote=find('[data-account-note]'),postStatus=find('[data-post-status]'),bodyInput=form.elements.body,submit=form.querySelector('[type=submit]');
const page=section.dataset.page;
let richComposer;
let replyTarget=null;const replyThreads=new Map();
const columns='id,user_id,author_name,body,created_at,status,parent_id,reply_to_id,reply_to_name';
const replyContext=document.createElement('div');replyContext.className='note-reply-context';replyContext.hidden=true;const replyLabel=document.createElement('span'),cancelReply=text('button','取消回复');cancelReply.type='button';cancelReply.className='note-delete';cancelReply.onclick=()=>setReply(null);replyContext.append(replyLabel,cancelReply);form.prepend(replyContext);
function setReply(row){replyTarget=row;replyContext.hidden=!row;replyContext.style.display=row?'flex':'none';replyLabel.textContent=row?'回复 @'+row.author_name:'';submit.textContent=row?'发表回复':'发表留言'}
let api,user=null,nickname='',profileLoaded=false,profileIssue='',rows=[],offset=0,loading=false,posting=false,started=false,request=0,profileRequest=0,authRequest=0;
function message(value){find('[data-status]').textContent=value}
function postMessage(value){postStatus.textContent=value}
function text(tag,value){const node=document.createElement(tag);node.textContent=value;return node}
function failure(error){const code=error?.code;if(code==='23505')return '账号昵称已设置，请点击刷新重新读取。';if(code==='P0001'||String(code).includes('rate_limit'))return '操作过于频繁，请稍候再试。';if(code==='42501')return '请先验证邮箱并登录，再进行操作。';if(code==='PGRST205')return '留言服务暂未开放，请稍后再来。';return '暂时无法连接留言服务，请点击刷新重试。'}
async function timed(promise){let timer;try{return await Promise.race([promise,new Promise((_,reject)=>timer=setTimeout(()=>reject(Error('timeout')),12000))])}finally{clearTimeout(timer)}}
function identity(){
 const verified=!!user?.email_confirmed_at,canPost=verified&&!!nickname;
 find('[data-current-user]').hidden=!user;find('[data-identity]').textContent=nickname?'已登录：'+nickname:'已登录';
 authToggle.hidden=!!user;profileForm.hidden=!verified||!profileLoaded||!!nickname;
 form.querySelector('fieldset').disabled=!canPost;submit.disabled=!canPost||posting||(!bodyInput.value.trim()&&!richComposer?.hasSticker)||!!richComposer?.busy;
 accountNote.textContent=profileIssue||(!user?'登录后可以留言，账号与相册主站通用。':!verified?'请先完成邮箱验证。':!profileLoaded?'正在读取账号昵称…':!nickname?'请先设置账号昵称，保存后固定使用。':'使用固定昵称留言，支持删除自己的留言。');
 if(user&&authWidget.hidden)authPanel.hidden=true;
 find('[data-count]').textContent=bodyInput.value.length+' / 2000';
}
async function loadProfile(){
 const version=++profileRequest,id=user?.id;profileIssue='';profileLoaded=!id;
 if(!id){nickname='';identity();return}identity();
 try{const {data,error}=await api.from('roy_top_profiles').select('nickname').eq('user_id',id).abortSignal(AbortSignal.timeout(12000)).maybeSingle();if(version!==profileRequest||user?.id!==id)return;if(error)throw error;nickname=data?.nickname||'';profileLoaded=true}
 catch(error){if(version!==profileRequest)return;nickname='';profileIssue=failure(error)}identity();
}
async function applyUser(next){const changed=user?.id!==next?.id;user=next||null;if(changed){setReply(null);richComposer?.clear();nickname='';profileLoaded=false;rows=rows.filter(row=>row.status==='approved'||row.user_id===user?.id);render();postMessage('')}identity();await loadProfile()}
async function syncSession(){const version=++authRequest;try{const {data,error}=await timed(api.auth.getSession());if(version!==authRequest)return;if(error)throw error;await applyUser(data.session?.user||null)}catch(error){if(version===authRequest){profileIssue=failure(error);identity()}}}
function renderRow(row){
 const item=document.createElement('li'),header=document.createElement('div');header.className='note-meta';header.append(text('strong',row.author_name));
 const date=document.createElement('time');date.dateTime=row.created_at;date.textContent=new Date(row.created_at).toLocaleString('zh-CN',{timeZone:'Asia/Shanghai',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false});header.append(date);item.append(header);
 if(row.parent_id&&row.reply_to_name&&row.reply_to_id!==row.parent_id)item.append(text('small','回复 @'+row.reply_to_name));
 const content=document.createElement('div');if(window.RoyRichComments)window.RoyRichComments.renderBody(content,row.body,{markdown:false});else content.textContent=row.body;item.append(content);
 const reply=text('button','回复');reply.type='button';reply.className='note-delete';reply.onclick=()=>{if(!user||!nickname){authPanel.hidden=false;authPanel.querySelector('input')?.focus();postMessage('请先登录并设置昵称。');return}setReply(row);richComposer?.focus()};item.append(reply);
 if(row.user_id===user?.id){const remove=text('button','删除');remove.type='button';remove.className='note-delete';remove.onclick=async()=>{if(!confirm('删除这条留言？'))return;remove.disabled=true;try{const {error}=await api.from('roy_top_comments').delete().eq('id',row.id).eq('user_id',user.id).abortSignal(AbortSignal.timeout(12000));if(error)throw error;if(replyTarget?.id===row.id)setReply(null);await load(true);postMessage('留言已删除。')}catch(error){remove.disabled=false;postMessage(failure(error))}};item.append(remove)}
 if(!row.parent_id){const thread=replyThreads.get(row.id);if(thread?.rows.length){const children=document.createElement('ul');children.className='note-thread';children.style.cssText='border-left:2px solid var(--line,#aaa);padding-left:12px;margin-top:12px;list-style:none';for(const child of [...thread.rows].reverse())children.append(renderRow(child));item.append(children)}if(thread?.more){const moreReplies=text('button','更多回复');moreReplies.type='button';moreReplies.className='note-delete';moreReplies.disabled=thread.loading;moreReplies.onclick=()=>void loadReplies(row.id,false);item.append(moreReplies)}}
 return item;
}
function render(){list.replaceChildren(...rows.map(renderRow))}
async function loadReplies(root,reset=true,paint=true){
 const previous=replyThreads.get(root);if(previous?.loading)return;const thread={rows:reset?[]:previous?.rows||[],more:false,loading:true};replyThreads.set(root,thread);
 try{const {data,error}=await api.from('roy_top_comments').select(columns).eq('page_path',page).eq('parent_id',root).order('created_at',{ascending:false}).order('id',{ascending:false}).range(thread.rows.length,thread.rows.length+19).abortSignal(AbortSignal.timeout(12000));if(error)throw error;thread.rows.push(...(data||[]));thread.more=data?.length===20}catch(error){thread.rows=previous?.rows||[];postMessage(failure(error))}finally{thread.loading=false;if(paint)render()}
}
async function load(reset=false){
 if(!api||loading&&!reset)return;const version=++request,start=reset?0:offset;loading=true;more.disabled=true;reload.disabled=true;message('正在读取留言…');
 try{const {data,error}=await api.from('roy_top_comments').select(columns).eq('page_path',page).is('parent_id',null).order('created_at',{ascending:false}).order('id',{ascending:false}).range(start,start+19).abortSignal(AbortSignal.timeout(12000));if(version!==request)return;if(error)throw error;
  const incoming=data||[];rows=reset?incoming:[...rows,...incoming.filter(row=>!rows.some(existing=>existing.id===row.id))];offset=start+incoming.length;more.hidden=incoming.length<20;if(reset)replyThreads.clear();await Promise.all(incoming.map(row=>loadReplies(row.id,true,false)));if(version!==request)return;render();message(rows.length?(more.hidden?rows.length+' 条留言':'已加载 '+rows.length+' 条留言'):'还没有留言，欢迎写下第一句。')
 }catch(error){if(version===request)message(failure(error))}finally{if(version===request){loading=false;more.disabled=false;reload.disabled=false}}
}
async function ready(){
 if(started||!window.RoyPhotoClient)return;started=true;clearTimeout(startupTimer);api=window.RoyPhotoClient;
 if(window.RoyRichComments){richComposer=window.RoyRichComments.createComposer(bodyInput,{limit:2000,markdown:false});bodyInput.addEventListener('roy-rich-change',identity)}
 api.auth.onAuthStateChange((_event,next)=>{++authRequest;setTimeout(async()=>{await applyUser(next?.user||null);await load(true)},0)});await Promise.all([syncSession(),load(true)]);
}
authToggle.onclick=()=>{authPanel.hidden=!authPanel.hidden;authToggle.setAttribute('aria-expanded',String(!authPanel.hidden));if(!authPanel.hidden)authPanel.querySelector('input')?.focus()};
authWidget.addEventListener('roy-auth-complete',()=>void syncSession());
find('[data-logout]').onclick=async()=>{try{const {error}=await api.auth.signOut({scope:'local'});if(error)throw error;authPanel.hidden=true;await applyUser(null);await load(true)}catch(error){postMessage(failure(error))}};
profileForm.onsubmit=async event=>{event.preventDefault();if(!user||nickname)return;const value=profileForm.elements.nickname.value.trim();if(!value||value.length>40)return;const button=profileForm.querySelector('button');button.disabled=true;try{const {error}=await api.from('roy_top_profiles').insert({user_id:user.id,nickname:value}).abortSignal(AbortSignal.timeout(12000));if(error)throw error;await loadProfile();postMessage('昵称已保存，可以留言了。')}catch(error){postMessage(failure(error));if(error?.code==='23505')await loadProfile()}finally{button.disabled=false}};
bodyInput.oninput=identity;
form.onsubmit=async event=>{event.preventDefault();const body=bodyInput.value.trim();if(posting||!user?.email_confirmed_at||!nickname||(!body&&!richComposer?.hasSticker)||richComposer?.busy||body.length>2000)return;posting=true;identity();postMessage('正在发送…');try{const {error}=await api.from('roy_top_comments').insert({page_path:page,user_id:user.id,author_name:nickname,body:richComposer?richComposer.value():body,parent_id:replyTarget?.id||null}).abortSignal(AbortSignal.timeout(12000));if(error)throw error;bodyInput.value='';richComposer?.clear();setReply(null);await load(true);postMessage('留言已发送。')}catch(error){postMessage(failure(error))}finally{posting=false;identity()}};
more.onclick=()=>void load();reload.onclick=async()=>{if(!api){location.reload();return}await Promise.all([syncSession(),load(true)])};
identity();
const startupTimer=setTimeout(()=>{if(!started){message('留言模块未能加载，请刷新页面重试。');accountNote.textContent='登录模块暂不可用，请检查网络后重试。'}},12000);
window.addEventListener('roy-photo-ready',()=>void ready(),{once:true});
if(window.RoyPhotoClient)void ready();else import('/shared/photo-client.js?v=20261024-blog').then(()=>void ready()).catch(()=>{clearTimeout(startupTimer);message('留言模块未能加载，请刷新页面重试。');accountNote.textContent='登录模块暂不可用，请检查网络后重试。'});

</script></body></html>
