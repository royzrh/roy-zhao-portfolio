<!DOCTYPE html><html lang="zh-CN"> <head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta http-equiv="refresh" content="0;url=/blog/all"><link rel="canonical" href="https://royzhao.cn/blog/all"><title>Roy Zhao | 博客</title><script type="module" src="/assets/page.D1uwR3nK.js"></script><script data-local-preview>
(()=>{
  if(location.protocol!=='file:') return;
  const root=new URL("../",location.href);
  const mount='/';
  const isLocal=(raw)=>raw?.startsWith('/')&&!raw.startsWith('//');
  const local=(raw)=>{
    if(!isLocal(raw)) return raw;
    const url=new URL(raw,'https://royzhao.cn');
    let relative=url.pathname;
    while(relative.startsWith('/')) relative=relative.slice(1);
    if(!relative || relative.endsWith('/')) relative+='index.html';
    else if(!relative.split('/').pop().includes('.')) relative+='/index.html';
    return new URL(relative+url.search+url.hash,root).href;
  };
  for(const sheet of document.querySelectorAll('link[rel="stylesheet"]')){
    const original=sheet.getAttribute('href');
    if(isLocal(original)){
      const url=new URL(original,'https://royzhao.cn');
      const slash=url.pathname.lastIndexOf('/');
      sheet.href=local(url.pathname.slice(0,slash+1)+'offline-'+url.pathname.slice(slash+1));
    }
  }
  const ready=()=>{
    for(const comments of document.querySelectorAll('roy-comments')){
      const status=comments.querySelector('[data-status]');
      if(status) status.textContent=comments.dataset.en==='true'?'Open the website address to use comments.':'请通过网站地址打开页面后使用评论。';
    }
    for(const element of document.querySelectorAll('[href],[src],[poster],[srcset],[data-target-url]')){
      for(const name of ['href','src','poster','data-target-url']){
        const value=element.getAttribute(name);
        if(isLocal(value)) element.setAttribute(name,local(value));
      }
      const srcset=element.getAttribute('srcset');
      if(srcset?.includes(mount)){
        element.setAttribute('srcset',srcset.split(',').map(item=>{
          const parts=item.trim().split(' ');
          parts[0]=local(parts[0]);
          return parts.join(' ');
        }).join(', '));
      }
    }
    const search=document.querySelector('site-search');
    if(search){
      const entries=JSON.parse(search.dataset.entries||'[]');
      const input=search.querySelector('input');
      const list=search.querySelector('ul');
      const status=search.querySelector('p');
      const english=search.dataset.en==='true';
      const render=()=>{
        const query=input.value.trim().toLocaleLowerCase();
        const results=entries.filter(entry=>[entry.title,entry.description,entry.body||''].join(' ').toLocaleLowerCase().includes(query));
        status.textContent=english?results.length+' results':'找到 '+results.length+' 个结果';
        list.replaceChildren();
        for(const entry of results){
          const item=document.createElement('li');
          const link=document.createElement('a');
          link.href=local(entry.url);
          link.className='block rounded-xl border bg-card px-5 py-4 transition-colors hover:bg-muted/30';
          const title=document.createElement('span');
          title.className='font-medium';
          title.textContent=entry.title;
          const description=document.createElement('p');
          description.className='mt-2 text-sm text-muted-foreground';
          description.textContent=entry.description;
          link.append(title,description);
          item.append(link);
          list.append(item);
        }
      };
      input.addEventListener('input',render);
      render();
    }
  };
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',ready,{once:true});
  else ready();
  document.addEventListener('click',event=>{
    const target=event.target;
    if(!(target instanceof Element)) return;
    const language=target.closest('#language-switch-btn');
    if(language){
      event.preventDefault();
      event.stopImmediatePropagation();
      location.href=local(language.getAttribute('data-target-url'));
      return;
    }
    const theme=target.closest('#toggleDarkMode');
    if(theme){
      event.preventDefault();
      event.stopImmediatePropagation();
      const dark=!document.documentElement.classList.contains('dark');
      document.documentElement.classList.toggle('dark',dark);
      try{localStorage.setItem('theme',dark?'dark':'light')}catch{}
      return;
    }
    const menu=target.closest('#toggleMenu');
    if(menu){
      event.preventDefault();
      event.stopImmediatePropagation();
      const expanded=menu.closest('header-component')?.classList.toggle('expanded')||false;
      menu.setAttribute('aria-expanded',String(expanded));
      return;
    }
    const link=target.closest('a[href]');
    if(link && isLocal(link.getAttribute('href'))){
      event.preventDefault();
      location.href=local(link.getAttribute('href'));
    }
  },true);
})();
</script></head> <body><p><a href="/blog/all">查看全部 →</a></p></body></html>
