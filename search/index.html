</style><script type="module" src="/assets/page.D1uwR3nK.js"></script><script data-local-preview>
(()=>{
  if(location.protocol!=='file:') return;
  const root=new URL("../",location.href);
  const mount='/';
  const isLocal=(raw)=>raw?.startsWith('/')&&!raw.startsWith('//');
  const local=(raw)=>{
    if(!isLocal(raw)) return raw;
    const url=new URL(raw,'https://royzhao.cn');
    let relative=url.pathname;
    while(relative.startsWith('/')) relative=relative.slice(1);
    if(!relative || relative.endsWith('/')) relative+='index.html';
    else if(!relative.split('/').pop().includes('.')) relative+='/index.html';
    return new URL(relative+url.search+url.hash,root).href;
  };
  for(const sheet of document.querySelectorAll('link[rel="stylesheet"]')){
    const original=sheet.getAttribute('href');
    if(isLocal(original)){
      const url=new URL(original,'https://royzhao.cn');
      const slash=url.pathname.lastIndexOf('/');
      sheet.href=local(url.pathname.slice(0,slash+1)+'offline-'+url.pathname.slice(slash+1));
    }
  }
  const ready=()=>{
    for(const comments of document.querySelectorAll('roy-comments')){
      const status=comments.querySelector('[data-status]');
      if(status) status.textContent=comments.dataset.en==='true'?'Open the website address to use comments.':'请通过网站地址打开页面后使用评论。';
    }
    for(const element of document.querySelectorAll('[href],[src],[poster],[srcset],[data-target-url]')){
      for(const name of ['href','src','poster','data-target-url']){
        const value=element.getAttribute(name);
        if(isLocal(value)) element.setAttribute(name,local(value));
      }
      const srcset=element.getAttribute('srcset');
      if(srcset?.includes(mount)){
        element.setAttribute('srcset',srcset.split(',').map(item=>{
          const parts=item.trim().split(' ');
          parts[0]=local(parts[0]);
          return parts.join(' ');
        }).join(', '));
      }
    }
    const search=document.querySelector('site-search');
    if(search){
      const entries=JSON.parse(search.dataset.entries||'[]');
      const input=search.querySelector('input');
      const list=search.querySelector('ul');
      const status=search.querySelector('p');
      const english=search.dataset.en==='true';
      const render=()=>{
        const query=input.value.trim().toLocaleLowerCase();
        const results=entries.filter(entry=>[entry.title,entry.description,entry.body||''].join(' ').toLocaleLowerCase().includes(query));
        status.textContent=english?results.length+' results':'找到 '+results.length+' 个结果';
        list.replaceChildren();
        for(const entry of results){
          const item=document.createElement('li');
          const link=document.createElement('a');
          link.href=local(entry.url);
          link.className='block rounded-xl border bg-card px-5 py-4 transition-colors hover:bg-muted/30';
          const title=document.createElement('span');
          title.className='font-medium';
          title.textContent=entry.title;
          const description=document.createElement('p');
          description.className='mt-2 text-sm text-muted-foreground';
          description.textContent=entry.description;
          link.append(title,description);
          item.append(link);
          list.append(item);
        }
      };
      input.addEventListener('input',render);
      render();
    }
  };
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',ready,{once:true});
  else ready();
  document.addEventListener('click',event=>{
    const target=event.target;
    if(!(target instanceof Element)) return;
    const language=target.closest('#language-switch-btn');
    if(language){
      event.preventDefault();
      event.stopImmediatePropagation();
      location.href=local(language.getAttribute('data-target-url'));
      return;
    }
    const theme=target.closest('#toggleDarkMode');
    if(theme){
      event.preventDefault();
      event.stopImmediatePropagation();
      const dark=!document.documentElement.classList.contains('dark');
      document.documentElement.classList.toggle('dark',dark);
      try{localStorage.setItem('theme',dark?'dark':'light')}catch{}
      return;
    }
    const menu=target.closest('#toggleMenu');
    if(menu){
      event.preventDefault();
      event.stopImmediatePropagation();
      const expanded=menu.closest('header-component')?.classList.toggle('expanded')||false;
      menu.setAttribute('aria-expanded',String(expanded));
      return;
    }
    const link=target.closest('a[href]');
    if(link && isLocal(link.getAttribute('href'))){
      event.preventDefault();
      location.href=local(link.getAttribute('href'));
    }
  },true);
})();

</script> <script type="module" src="/assets/Header.astro_astro_type_script_index_0_lang.CD6WPM3I.js"></script>  <main class="min-h-[45vh]"><h1 class="text-3xl font-medium">站内搜索</h1><site-search data-entries="[{&#34;title&#34;:&#34;关于赵润涵&#34;,&#34;url&#34;:&#34;/about&#34;,&#34;description&#34;:&#34;Roy Zhao · 深圳大学 · Shenzhen University · 深圳&#34;},{&#34;title&#34;:&#34;相册与项目&#34;,&#34;url&#34;:&#34;/projects&#34;,&#34;description&#34;:&#34;royzhao.cn/zz/ · 相册 · Photography&#34;},{&#34;title&#34;:&#34;友情链接&#34;,&#34;url&#34;:&#34;/links&#34;,&#34;description&#34;:&#34;Cyril Fan · royzhao.cn&#34;},{&#34;title&#34;:&#34;片刻&#34;,&#34;url&#34;:&#34;/moments&#34;,&#34;description&#34;:&#34;登录后记录与交流&#34;},{&#34;title&#34;:&#34;研究&#34;,&#34;url&#34;:&#34;/academic&#34;,&#34;description&#34;:&#34;研究笔记与项目记录 · Research notes&#34;},{&#34;title&#34;:&#34;秋天&#34;,&#34;url&#34;:&#34;/blog/autumn&#34;,&#34;description&#34;:&#34;autumn&#34;,&#34;body&#34;:&#34;## 正文\n\n我还是一如既往的想念秋天，秋天的人和事儿。\n总说西南没有秋天，可是有桂花香满街，有绵绵不断的冷冰冰的雨，我喜欢在雨天慢慢的踱步。早上冒热气的米粉和油茶，晚上烫嘴的红薯煮。想念晚秋的银杏，黄灿灿落了一地，在温热的太阳下闪闪发光。&#34;},{&#34;title&#34;:&#34;1550nm波长下D²NN的结构设计探究&#34;,&#34;url&#34;:&#34;/blog/d2nn-1550nm-stage-report&#34;,&#34;description&#34;:&#34;主要围绕1550nm波长下衍射神经网络的结构设计、分类性能评估和传播距离优化开展研究。&#34;,&#34;body&#34;:&#34;## 1 工作概述\n\n本次主要围绕 1550 nm 波长下衍射深度神经网络的结构设计、分类性能评估和传播距离优化开展研究。在前期复现论文的基础上，进一步考虑实验室使用 1550 nm 激光的实际条件，对网络的物理参数进行了调整，并通过数值仿真研究了不同衍射层数和不同层间传播距离对分类性能的影响。\n\n本次工作主要包括以下五个方面：\n\n1. 进一步确定适用于 1550 nm 波长的 D²NN 仿真参数。\n2. 完成单层、双层、三层和五层网络的 15 轮 训练结果整理与比较。\n3. 对已有模型进行独立测试，重点分析分类准确率和探测效率。\n4. 开展五层 D²NN 非均匀层间距搜索，比较等间距与非等间距结构。\n5. 完善训练代码，并设计后续全数据集对照实验。\n\n## 2 1550 nm D²NN 五层仿真模型参数确定\n\n在先前的仿真过程中，我全程采用论文提供的参数进行实验。与原论文采用的太赫兹波长相比，1550 nm 的波长明显更短，在相同尺寸和传播距离下，衍射行为也会发生明显变化。因此，本阶段重点考虑了波长、神经元间距、传播距离和探测器尺寸之间的关系。\n\n通过参考资料与分组测试，最终采用如下结构作为系统的基准结构。后续仿真过程中，还增加了不等间距组的训练。\n\n| 类别 | 已验证配置 |\n| :--- | ---: |\n| 每层神经元数量 | 200 × 200 |\n| 神经元总量 | 200,000 |\n| 神经元间距 | 50 μm |\n| 相位板尺寸 | 10 × 10 mm² |\n| 输入平面 → 第一层 | 30 mm |\n| 层级间隔 | 100 mm |\n| 第五层 → 探测器 | 100 mm |\n| 传播距离 | 530 mm |\n| 探测器数目 | 10 |\n| 探测器尺寸 | 0.6 × 0.6 mm² |\n\n*表 1　五层等间距网络的基准参数*\n\n![五层等间距网络结构示意图](./images/five-layer-layout.webp)\n\n*图 1　当前五层等间距配置示意图*\n\n## 3 不同层数的分类性能比较\n\n| 层数 | 最佳轮次 | 验证准确率 | 测试准确率 | 正确探测器效率 | 总捕获率 |\n| :--- | ---: | ---: | ---: | ---: | ---: |\n| 1 | 15 | 39.60% | 39.95% | 2.203% | 12.317% |\n| 2 | 14 | 76.70% | 78.18% | 1.303% | 4.035% |\n| 3 | 15 | 83.10% | 83.51% | 0.818% | 2.047% |\n| 5 | 11 | 87.00% | 88.26% | 0.375% | 0.728% |\n\n*表 2　15 轮小范围训练后不同层数系统的测试结果*\n\n为对比不同层数系统的分类性能，我分别对四种层数配置进行了 5 轮与 15 轮小范围训练。使用 3,000 张图片训练后，再使用 10,000 张测试图像进行测试。表 2 汇总了 15 轮小范围训练的结果。\n\n对比实验保持层间距、输入距离和输出距离等参数一致，仅逐步增加相位板层数。单层网络取得 39.95% 的测试准确率，说明在当前光学结构与训练条件下，单次相位调制对 MNIST 分类任务的处理能力较为有限。双层网络的测试准确率达到 78.18%，显著增强了网络对输出光强分布的调控能力。\n\n在这几组实验中，随着网络层数增加，分类准确率的提升幅度逐渐减小，额外层带来的提升并不是线性叠加的。\n\n### 3.1 双层网络的取舍\n\n与单层网络相比，双层网络增加了一块相位板和一段自由空间传播，使光场能够经历更多次相位调制与衍射演化，获得了明显更高的分类准确率，达到 78.18%。鉴于本次为小范围训练，完整数据集训练的结果可能还有一定提升。\n\n同时，正确探测器效率从 2.203% 降为 1.303%，总捕获率从 12.317% 降为 4.035%。单层虽然收光更多，分到真实类别的相对份额却更低，许多类别难以区分。\n\n![双层网络相位分布](./images/two-layer-phases.webp)\n\n![双层网络测试混淆矩阵](./images/two-layer-confusion.webp)\n\n*图 2　双层网络15轮小范围训练结果*\n\n| 层数 | 系统长度 | 准确度 | 正确探测器效率 | 捕获效率 | 正确光强占比 |\n| :--- | ---: | ---: | ---: | ---: | ---: |\n| 1 | 130 mm | 0.3995 | 0.0220 | 0.12 | 0.17 |\n| 2 | 230 mm | 0.7818 | 0.0130 | 0.04 | 0.32 |\n| 3 | 330 mm | 0.8351 | 0.0082 | 0.02 | 0.39 |\n| 5 | 530 mm | 0.8826 | 0.0037 | 0.0072 | 0.49 |\n\n*表 3　不同层数系统探测效率*\n\n与三层和五层网络相比，双层网络的优势在于结构更加简单。所需的光学元件数量更少，对光路搭建和对准的要求也相对较低，从而使得双层网络的捕获效率较高，达到了三层网络的约 2 倍。若实际实验对光学元件数量、系统尺寸和探测器收光能力存在较高要求，双层网络经优化后可能具有更好的实现条件。不过，其相位参数数量只有 80,000 个，明显少于五层网络的 200,000 个，其分类准确率仍低于三层和五层网络。因此，双层 D²NN 在当前实验中体现出分类性能与系统复杂度之间的折中。\n\n另外，由于不同层数的网络总传播长度不同，当前实验还不能完全排除光路长度变化对分类结果的影响。后续仍需要进一步研究固定总传播长度时，不同网络层数的性能变化。\n\n### 3.2 捕获效率限制来源\n\n理想仿真中的相位板不吸收光能，因此需要从其他因素分析光能损失的来源。\n\n#### 3.2.1 有限孔径造成的光能损失\n\n当前相位板尺寸为 $D=10\\,\\mathrm{mm}$，有效光学孔径为 $10\\times10\\,\\mathrm{mm}^2$。光通过相位板后发生衍射，传播过程中光场可能向横向扩展。对于具有相位像素尺度空间变化的光场，可以用以下关系估计其特征衍射角：\n$$\n\\theta \\sim \\frac{\\lambda}{p}.\n$$\n\n代入数值 $\\lambda=1.55\\,\\mu\\mathrm{m}$、$p=50\\,\\mu\\mathrm{m}$，可得：\n$$\n\\theta \\sim 0.031\\,\\mathrm{rad}.\n$$\n\n对应约 1.78° 的偏转。虽然这一估计并不适用于所有光线，但从定性上看，对于只有 10 mm 宽的相位板，传播 100 mm 后，具有较大横向空间频率的光场成分可能到达孔径之外，层数增加会带来更多次潜在的孔径截断，由表 3 可见，这一变化趋势与累积孔径截断的解释一致。\n\n#### 3.2.2 探测器面积限制\n\n每个探测器的面积为：\n\n$$\nA_d=0.6\\times0.6=0.36\\,\\mathrm{mm}^2.\n$$\n\n10 个探测器的总面积为 $3.6\\,\\mathrm{mm}^2$。\n\n相对于相位板面积 $A_{\\mathrm{aperture}}=100\\,\\mathrm{mm}^2$，探测器面积占比为：\n\n$$\n\\frac{3.6}{100}\\times100\\%=3.6\\%.\n$$\n\n也就是说，探测器只能收集有限区域内的光。\n\n## 4 五层网络全集结果\n\n为进一步评估模型的泛化能力，对此前训练得到的五层等间距网络，使用 MNIST 官方 10,000 张测试图像进行了独立评估，结果如下：\n\n![五层等间距网络相位分布](./images/uniform-five-layer-phases.webp)\n\n*图 3　五层网络10轮全集训练相位图*\n\n![五层等间距网络训练曲线](./images/uniform-training.webp)\n\n![非均匀间距网络小范围训练曲线](./images/nonuniform-small-sample-training.webp)\n\n*图 4　D²NN 的 10轮训练过程*\n\n![五层等间距网络混淆矩阵](./images/uniform-confusion.webp)\n\n![五层等间距网络验证曲线](./images/uniform-validation.webp)\n\n*图 5　D²NN 的 10轮训练过程及混淆矩阵*\n\n最终测试准确率达到 **89.23%**，相较小范围训练提高 **0.97 个百分点**。\n\n## 5 五层不等间距参数探寻\n\n![九组非均匀层间距候选搜索结果](./images/spacing-search.webp)\n\n*图 6　不同的不等间距参数小范围训练结果*\n\n衍射网络可以通过调整层间距改善性能。这里列出 9 组参数，在层间总长度固定的条件下，由程序自动生成不同组合，分别训练并比较结果，以枚举法寻找较优的间距方案。\n\n这种方案存在明显局限：计算成本较高，而且只能找到已搜索候选中的较优值，不能保证获得连续参数空间中的最优解。\n\n![小范围训练方案的准确率及探测效率对比](./images/small-sample-comparison.webp)\n\n*图 7　三种准确率较高的方案的相关准确度、正确探测器效率与总光强效率*\n\n通过分类训练，我得到三组准确率较高的方案，并选取其中最高的一组继续训练。四段间距分别为 150 mm、125 mm、75 mm、25 mm，训练 15 轮，其他参数与五层等间距网络保持一致。相关结果如下：\n\n![非均匀间距网络混淆矩阵](./images/nonuniform-confusion.webp)\n\n![非均匀间距网络小范围训练曲线](./images/nonuniform-small-sample-training.webp)\n\n![非均匀间距网络全集训练曲线](./images/nonuniform-training.webp)\n\n![非均匀间距网络全集验证曲线](./images/nonuniform-validation.webp)\n\n![非均匀间距网络五层相位分布](./images/nonuniform-five-layer-phases.webp)\n\n*图 8　非均匀间隔网络10轮全集训练结果*\n\n网络测试准确率为 **89.14%**，与等间距网络的性能对比如下：\n\n| 指标 | 等间距 | 非均匀间距 | 对比结果 |\n| :--- | ---: | ---: | ---: |\n| 最佳 Epoch | 7 | 7 | - |\n| 最佳验证准确率 | 87.98% | 88.14% | +0.16% |\n| 测试准确率 | 89.23% | 89.14% | -0.09% |\n| 正确探测器效率 | 0.1726% | 0.1801% | +4.34% |\n| 全部探测器捕获效率 | 0.2809% | 0.3044% | +8.37% |\n| 正确探测器光强占比 | 58.41% | 56.52% | -1.90% |\n| FFT 窗口能量比例 | 38.40% | 43.62% | +5.22% |\n\n*表 4　均匀网络与非均匀网络的对比表*\n\n从对比中可以看到，使用非等间距后能有效提升网络的正确探测器效率与捕获效率，这意味着在当前仿真条件下，非均匀结构能让更多光能进入探测器区域。在相同输入光功率下，更高的探测器捕获效率有助于提高可获得的探测信号。不过当前正确探测器效率仅为约 0.18%，绝对数值依然很低。实际信噪比是否改善，还需要考虑探测器噪声、串扰及光学损耗。\n\n![等间距与非均匀间距网络训练过程对比](./images/uniform-nonuniform-training-comparison.webp)\n\n*图 9　均匀网络与非均匀网络训练过程*\n\n从训练过程来看，非均匀间距网络整体表现出一定优势。两种网络均在训练初期快速收敛，但非均匀间距网络在前期具有更高的分类准确率，且在大多数训练轮次中保持了略高的验证准确率，说明其能够较快建立有效的分类能力。第 7 轮时，非均匀间距网络的最佳验证准确率达到 88.14%，高于等间距网络的 87.98%。\n\n更值得关注的是，非均匀间距网络在整个训练过程中始终保持了更高的探测器光能捕获效率，最终测试中正确探测器效率相对提高 4.34%，全部探测器捕获效率相对提高 8.37%，FFT 窗口能量比例相对提高 13.59%。\n\n虽然非均匀网络的损失函数略高，最终测试准确率也略低 0.09 个百分点，但两种网络的分类性能总体接近。这表明非均匀层间距能够在基本保持分类性能的同时，提高光能捕获效率，为后续 D²NN 网络结构优化提供了有价值的方向。\n\n### 5.1 将层间距作为可训练参数的思路\n\n在枚举法之外，我还考虑了第二种方法。本次仿真使用角谱法，其传播传递函数为：\n$$\nH\\left({f}_{x},{f}_{y},z\\right)=\\operatorname{exp}\\left[iz\\left(\\sqrt{{k}^{2}-{\\left(2\\pi {f}_{x}\\right)}^{2}-{\\left(2\\pi {f}_{y}\\right)}^{2}}-k\\right)\\right]\n$$\n\n也就是说，传播距离 $z$ 直接参与光场计算，因此可以通过自动微分计算损失函数对传播距离的梯度，即把层间距变成可训练参数。这样一次训练过程中就可以不断调整传播距离，无须提前枚举大量候选组合，能够大大提高训练的效率。\n\n## 6 源码解读\n\n### 6.1 网络结构与参数设置模块\n\n程序以论文为理论基础，构建了五层相位型衍射分类网络，每层包含 200 × 200 个神经元，共有 20 万个可训练相位参数。程序支持设置工作波长、神经元间距、层间距及探测器尺寸等物理参数。其中，四段层间距可以独立指定，用于研究等间距与非均匀间距结构对网络性能的影响。\n\n### 6.2 输入图像编码模块\n\n程序采用 MNIST 手写数字数据集进行分类训练，通过 `encode()` 函数将 28 × 28 灰度图像转换为输入光场。具体过程包括图像二值化、像素尺度调整、居中补零及强度归一化，使数字图像能够以光场振幅分布的形式输入衍射网络。该部分属于本次仿真的具体输入编码实现。\n\n### 6.3 光场传播与相位调制模块\n\n光场传播是程序的核心部分。参考衍射神经网络的光学传播原理，程序利用快速傅里叶变换（FFT）实现角谱法（ASM），模拟光场在自由空间中的传播。角谱法的数值传播理论及采样问题可参考 Matsushima 等人的研究。每层衍射单元通过复数透射函数实现相位调制，程序将可训练参数映射至 $0$～$\\pi$ 的相位范围。对于非均匀间距网络，分别构建不同传播距离对应的传递函数，从而模拟各层之间不同的光场传播过程。\n\n### 6.4 光强探测与分类模块\n\n参考 D²NN 的光强探测分类机制，程序在输出平面设置 10 个探测区域，分别对应数字 0～9。光场经过五层传播与调制后，通过计算复振幅的模平方获得输出光强，再对各探测区域内的光强进行积分。最终以接收光强最大的探测器作为预测类别，实现手写数字的光学分类。\n\n### 6.5 损失函数模块\n\n程序通过 `compute_loss()` 函数计算网络的优化目标，提供 Baseline 和 Joint 两种损失函数。Baseline 综合考虑分类交叉熵、正确探测器效率及探测器外能量比例；Joint 则采用对数效率惩罚，加强对正确探测器效率和总探测器捕获效率的优化。两种损失函数均为本次仿真的具体设计。\n\n### 6.6 网络训练与参数优化模块\n\n程序基于 PyTorch 深度学习框架实现网络训练，并使用 Adam 优化算法更新相位参数。训练过程中，程序通过自动微分计算损失函数对各层相位参数的梯度，实现相位分布的迭代优化。同时使用验证集评估网络性能，并根据验证准确率及验证损失选择最佳模型。层间传播距离在训练前确定，不参与梯度更新。\n\n### 6.7 性能评估与结果输出模块\n\n训练完成后，程序对最佳模型进行性能评估，主要统计分类准确率、正确探测器效率、全部探测器捕获效率及光强占比等指标，并保存训练曲线、混淆矩阵和各层相位分布图。这些结果用于分析不同层间距结构对分类性能与光能利用率的影响，为后续网络结构优化提供依据。\n\n<!-- 编辑待核对项（不在博客正文中显示）：\n- 原文非均匀层间距写为 150/125/75/25 mm，图内标注为 150/125/75/50 mm。本稿保留正文数值，待作者核对实际配置。\n- 原文在“10 轮全集训练”部分插入了标注“15 epochs / 3000 training samples”的图片，且该图重复出现。本稿保留图片及位置，待作者确认。\n- 表 4 对比结果列沿用原数值。准确率及光强比例的差值与效率的相对变化使用不同口径，发布前请统一“百分点”和“相对百分比”的标注；58.41% 与 56.52% 的显示值之差也需核对舍入。\n-->\n\n[code](https://github.com/royzrh/simulation-d2nn)&#34;}]" data-en="false"> <label class="sr-only" for="search-query">搜索关键字</label> <input id="search-query" type="search" placeholder="搜索文章与页面…" class="my-5 w-full rounded-xl border-2 bg-transparent px-4 py-3 outline-none focus:border-foreground" autocomplete="off"> <p class="mb-5 text-sm text-muted-foreground" aria-live="polite"></p> <ul class="flex flex-col gap-4"></ul> </site-search> <script type="module">class p extends HTMLElement{connectedCallback(){const u=JSON.parse(this.dataset.entries||"[]"),c=this.dataset.en==="true",r=this.querySelector("input"),l=this.querySelector("ul"),a=this.querySelector("p"),i=()=>{const m=r.value.trim().toLocaleLowerCase(),t=u.filter(e=>[e.title,e.description,e.body||""].join(" ").toLocaleLowerCase().includes(m));a.textContent=c?`${t.length} results`:`找到 ${t.length} 个结果`,l.replaceChildren();for(const e of t){const d=document.createElement("li"),n=document.createElement("a");n.href=e.url,n.className="block rounded-xl border bg-card px-5 py-4 transition-colors hover:bg-muted/30";const s=document.createElement("span");s.className="font-medium",s.textContent=e.title;const o=document.createElement("p");o.className="mt-2 text-sm text-muted-foreground
